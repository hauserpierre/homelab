apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radicale-ingress
  namespace: radicale
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: radicale.${INTERNAL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radicale
                port:
                  number: 5232