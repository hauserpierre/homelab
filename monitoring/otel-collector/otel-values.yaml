# ------------------------------------------------------------------------------
# OpenTelemetry Collector: log collection (replaces the deprecated Promtail)
# Helm chart: open-telemetry/opentelemetry-collector
#
# Mode: DaemonSet (1 pod per node)
# Source: container logs via /var/log/pods (logsCollection preset)
# Destination: Loki through its native OTLP endpoint (Loki >= 3.0)
# Bonus: also accepts application OTLP (ports 4317/4318), so an instrumented
#        app can send its logs directly to the collector.
# ARM64 compatible
# ------------------------------------------------------------------------------

mode: daemonset

fullnameOverride: otel-collector

# Recent chart versions require the image to be selected explicitly.
# The "k8s" variant includes the relevant Kubernetes components.
image:
  repository: otel/opentelemetry-collector-k8s

# --- Chart presets ---
presets:
  # Mounts /var/log/pods and configures the filelog receiver (CRI parsing included)
  logsCollection:
    enabled: true
    includeCollectorLogs: false   # avoids the collector -> loki -> collector loop
  # Enriches each log with K8s metadata (namespace, pod, container...)
  kubernetesAttributes:
    enabled: true

# --- Collector configuration (merged with the one generated by the presets) ---
config:
  exporters:
    otlphttp:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp

  service:
    pipelines:
      logs:
        exporters: [otlphttp]   # replaces the default debug exporter
      # No traces/metrics backend for now: pipelines disabled
      # (metrics are scraped by vmagent, outside OTel).
      traces: null
      metrics: null

# Also runs on the control plane (control-plane node)
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

resources:
  requests:
    memory: 64Mi
    cpu: 20m
  limits:
    memory: 256Mi
