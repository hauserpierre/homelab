# ------------------------------------------------------------------------------
# WAF middleware (Coraza + OWASP Core Rule Set)
#
# Initial mode: DetectionOnly. Attacks are LOGGED but not blocked.
# Watch the Traefik logs for a few days, then set SecRuleEngine to "On"
# to actually block them.
#
# kube-system namespace: a middleware can be referenced from any ingress
# through the annotation
#   traefik.ingress.kubernetes.io/router.middlewares: kube-system-waf@kubernetescrd
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: waf
  namespace: kube-system
spec:
  plugin:
    coraza:
      directives:
        - Include @recommended-conf
        - Include @crs-setup-conf
        - Include @owasp_crs/*.conf
        - SecRuleEngine DetectionOnly
