server:
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME: postgres
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: db-username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: db-password

valkey:
  enabled: true

machine-learning:
  enabled: false

immich:
  persistence:
    library:
      existingClaim: immich-library-pvc
