apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home
  namespace: kube-system            # where Traefik runs, see step 3
spec:
  secretName: wildcard-home-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.${PUBLIC_DOMAIN}"
    - ${PUBLIC_DOMAIN}