# TCP passthrough routing: Traefik forwards the raw TLS stream to the
# Teleport proxy based on the SNI. Teleport presents its own certificate
# (self-signed on a .cluster domain).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: teleport-passthrough
  namespace: teleport
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`teleport.${INTERNAL_DOMAIN}`)
      services:
        - name: teleport
          port: 443
  tls:
    passthrough: true
