replicaCount: 1

deployment:
  env:
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-postgres-secret
          key: password

image:
  tag: 1.26

service:
  http:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"
      prometheus.io/path: "/metrics"
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: gitea.${INTERNAL_DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls: [] # Add later if you want certs

persistence:
  enabled: true
  size: 8Gi
  storageClass: "nfs-cluster"

valkey-cluster:
  enabled: false
valkey:
  enabled: true
  primary:
    persistence:
      size: 2Gi
postgresql:
  enabled: true
  auth:
    username: gitea
    database: gitea
    existingSecret: gitea-postgres-secret
    secretKeys:
      userPasswordKey: password
postgresql-ha:
  enabled: false

gitea:
  admin:
    existingSecret: gitea-admin-secret
  config:
    metrics:
      ENABLED: true
    database:
      DB_TYPE: postgres
    indexer:
      # bleve (boltdb) needs file locks, which are unavailable on the NFS PVC
      # ("no locks available") -> issues indexed in the database, code index kept off NFS
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: true
      REPO_INDEXER_PATH: /tmp/gitea/indexers/repos.bleve
      STARTUP_TIMEOUT: 30m